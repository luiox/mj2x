# mj2x CI（Linux + Windows）
#
# 范围：mj2x-cli + mj2x_unittest / mj2x_integration_test / mj2x_rt_test
# （需 --with_tests=y）。E2E 依赖 javac/java（setup-java 提供）；MSVC/clang
# 缺失的用例按 AGENTS.md 约定 skip（不算失败）。依赖：luiox-repo git 直连包
# 由 CI 显式注册（与根 xmake.lua 的声明幂等同源）；gtest/nlohmann_json 走
# xrepo。全量回归用默认配置（backend=all），根因见 AGENTS.md「命令」。
# 注：set_defaultplat("windows")，linux 作业必须显式 -p linux。

name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  # pull_request 不限定目标分支：堆叠 PR 的 base 是另一条分支，限 main 会让
  # 堆叠链上的 PR 拿不到 CI。
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs (引用门禁 + Sphinx)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sphinx
        # 钉死本地实测通过的版本：-W 下警告集合随 Sphinx 小版本变，范围安装等于定时炸；升级随文档批次显式改这一行。
        run: python -m pip install --upgrade "sphinx==9.1.1"

      - name: Reference gate (check_refs)
        run: python doc/check_refs.py .

      # -E：增量缓存会跳过「回到旧状态」的文件，警告随之消失，等于没门禁。
      - name: "Build design docs (-W: 警告即失败)"
        run: sphinx-build -b html -E -W --keep-going doc doc/_build

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: mj2x-doc-html
          path: doc/_build
          retention-days: 14

      # 微观层：Doxygen 只吃头文件 /// 注释（Doxyfile 只收 *.hpp），与 RST 站互不干涉。
      # 版本必须钉死（与本地实测同版）：Doxyfile 的 WARN_* 档随版本增减标签，
      # apt 里的老版本会把「不认识的标签」报成告警，WARN_AS_ERROR 下直接变红。
      - name: Install Doxygen (pinned 1.18.0)
        run: |
          curl -fsSL https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz -o /tmp/dox.tar.gz
          mkdir -p "$HOME/doxygen"
          tar xzf /tmp/dox.tar.gz -C "$HOME/doxygen" --strip-components=1
          # GITHUB_PATH 只对后续步骤生效，同一步内验证吃不到新 PATH。
          echo "$HOME/doxygen/bin" >> "$GITHUB_PATH"

      - name: Build API docs (WARN_AS_ERROR)
        run: |
          doxygen --version
          doxygen Doxyfile

      - name: Upload API site
        uses: actions/upload-artifact@v4
        with:
          name: mj2x-doc-apidoc
          path: doc/_apidoc/html
          retention-days: 14

  build-and-test-linux:
    name: build & test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK (E2E javac/java)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake/packages
            ~/.local/share/xmake
          key: mj2x-xrepo-linux-x64-xmake309v2-${{ hashFiles('xmake.lua', 'xmake/**') }}
          restore-keys: |
            mj2x-xrepo-linux-x64-xmake309v2-

      - name: Register luiox-repo
        run: xmake repo --add luiox-repo https://github.com/luiox/luiox-repo.git

      - name: Configure (with tests)
        run: xmake f -p linux --with_tests=y -y

      - name: Build product
        run: xmake build -y mj2x-cli

      - name: Build tests
        run: |
          xmake build -y mj2x_unittest
          xmake build -y mj2x_integration_test
          xmake build -y mj2x_rt_test

      - name: Run unit tests
        run: xmake run mj2x_unittest --gtest_brief=1

      - name: Run integration tests
        run: xmake run mj2x_integration_test --gtest_brief=1

      - name: Run runtime tests
        run: xmake run mj2x_rt_test --gtest_brief=1

      # 产物给 e2e-matrix 矩阵腿跨机直跑：mj2x-cli 是 E2E 全链的翻译腿
      # （javac→mj2x→java，测试内 spawn），fake_zig/fake_xmake 供 cli 负向
      # 用例不退化成 skip。tar 打包保执行位（upload-artifact 不保留 POSIX
      # 权限位），同镜像族 runner 可直跑。
      - name: Pack test binaries (e2e-matrix 消费)
        run: tar czf mj2x-testbin.tar.gz -C build/linux/x64/release mj2x-cli mj2x_unittest mj2x_integration_test mj2x_fake_zig mj2x_fake_xmake

      - name: Upload test binaries
        uses: actions/upload-artifact@v4
        with:
          name: mj2x-testbin-ubuntu-latest
          path: mj2x-testbin.tar.gz
          retention-days: 7

  build-and-test-windows:
    name: build & test (windows)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK (E2E javac/java)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake/packages
          key: mj2x-xrepo-windows-x64-xmake309v2-${{ hashFiles('xmake.lua', 'xmake/**') }}
          restore-keys: |
            mj2x-xrepo-windows-x64-xmake309v2-

      - name: Register luiox-repo
        shell: bash
        run: xmake repo --add luiox-repo https://github.com/luiox/luiox-repo.git

      - name: Configure (with tests)
        shell: bash
        run: xmake f -p windows --with_tests=y -y

      - name: Build product
        shell: bash
        run: xmake build -y mj2x-cli

      - name: Build tests
        shell: bash
        run: |
          xmake build -y mj2x_unittest
          xmake build -y mj2x_integration_test
          xmake build -y mj2x_rt_test

      # 不走 xmake run：它会递归注入 target/包 linkdirs 进 PATH（mjbase 家族
      # 闭包 +5 包），垫到贴线后测试内 spawn 的 xmake 调 vcvarsall 再展开
      # PATH 越过 cmd 8191 上限直接退出，两例 CliTest 断言落空成误红
      # （main 全绿/分支红的同日同镜像对照 + 本地 PATH 长度因果复现实证）。
      # 本仓全静态 MT 无 DLL 解析需求，注入是死重，直调产物 exe。
      - name: Run unit tests
        shell: bash
        run: build/windows/x64/release/mj2x_unittest.exe --gtest_brief=1

      - name: Run integration tests
        shell: bash
        run: build/windows/x64/release/mj2x_integration_test.exe --gtest_brief=1

      - name: Run runtime tests
        shell: bash
        run: build/windows/x64/release/mj2x_rt_test.exe --gtest_brief=1

      # 产物给 e2e-matrix 矩阵腿跨机直跑：mj2x-cli 是 E2E 全链的翻译腿
      # （javac→mj2x→java，测试内 spawn），fake_zig/fake_xmake 供 cli 负向
      # 用例不退化成 skip。全静态 MT 链接，无运行时 DLL 解析需求。
      - name: Upload test binaries
        uses: actions/upload-artifact@v4
        with:
          name: mj2x-testbin-windows-latest
          path: |
            build/windows/x64/release/mj2x-cli.exe
            build/windows/x64/release/mj2x_unittest.exe
            build/windows/x64/release/mj2x_integration_test.exe
            build/windows/x64/release/mj2x_fake_zig.exe
            build/windows/x64/release/mj2x_fake_xmake.exe
          retention-days: 7

  # e2e-matrix：JDK 版本矩阵复跑主作业的全量测试二进制，保证 E2E 全链
  # （javac 编 fixture → mj2x 翻译 → java 跑产物）在 JDK 8/21/25 上工作。
  # 不重编产品：产物来自 needs 的主构建作业。JDK 17 由主作业两腿覆盖，
  # 不进矩阵。JDK 8 腿对 JDK 8 之后语法语料经 test_helper 的 skipOnJdkBelow
  # 版本门显式跳过（unittest/src/integration/java_corpus_e2e_test.cpp
  # corpusMinJdk 档位表），官方 SKIP 不算失败。测试内 spawn xmake 编生成
  # 工程（见上方 windows 直调注释），故 xmake/luiox-repo/xrepo 缓存照常置备。
  e2e-matrix:
    name: e2e matrix (${{ matrix.os }} jdk${{ matrix.jdk }})
    needs: [build-and-test-linux, build-and-test-windows]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        jdk: ['8', '21', '25']
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK (matrix leg)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages (linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake/packages
            ~/.local/share/xmake
          key: mj2x-xrepo-linux-x64-xmake309v2-${{ hashFiles('xmake.lua', 'xmake/**') }}
          restore-keys: |
            mj2x-xrepo-linux-x64-xmake309v2-

      - name: Cache xrepo packages (windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake/packages
          key: mj2x-xrepo-windows-x64-xmake309v2-${{ hashFiles('xmake.lua', 'xmake/**') }}
          restore-keys: |
            mj2x-xrepo-windows-x64-xmake309v2-

      - name: Register luiox-repo
        shell: bash
        run: xmake repo --add luiox-repo https://github.com/luiox/luiox-repo.git

      - name: Download test binaries (linux)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: mj2x-testbin-ubuntu-latest
          path: build/linux/x64/release

      - name: Extract test binaries (linux)
        if: runner.os == 'Linux'
        run: |
          tar xzf build/linux/x64/release/mj2x-testbin.tar.gz -C build/linux/x64/release
          rm build/linux/x64/release/mj2x-testbin.tar.gz

      - name: Download test binaries (windows)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: mj2x-testbin-windows-latest
          path: build/windows/x64/release

      # 直调形态与主作业 windows 腿一致（不走 xmake run，见主作业注释），
      # cwd = 仓根，资源定位与产物伴生定位（getBuildTargetPath）均成立。
      # 不设 gtest filter：宁多勿漏，全量二进制本身带环境/版本 skip 门。
      - name: Run unit tests (linux)
        if: runner.os == 'Linux'
        run: build/linux/x64/release/mj2x_unittest --gtest_brief=1

      - name: Run integration tests (linux)
        if: runner.os == 'Linux'
        run: build/linux/x64/release/mj2x_integration_test --gtest_brief=1

      - name: Run unit tests (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: build/windows/x64/release/mj2x_unittest.exe --gtest_brief=1

      - name: Run integration tests (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: build/windows/x64/release/mj2x_integration_test.exe --gtest_brief=1
